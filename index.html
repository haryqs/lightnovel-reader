<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅读器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body data-theme="light">
    <!-- 顶部工具栏 -->
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="app-brand" aria-label="LightNovel Reader">
          <img src="/app-icon.png" alt="" />
          <span>LN Reader</span>
        </div>
        <button id="btn-open" class="btn" title="打开 epub 文件">打开</button>
        <button id="btn-library" class="btn" title="本地轻小说书库">书库</button>
        <button id="btn-toc" class="btn" title="目录">目录</button>
        <button id="btn-annotations" class="btn" title="标注">标注</button>
        <!-- 隐藏的文件选择框，由「打开」按钮触发 -->
        <input id="file-input" type="file" accept=".epub" hidden />
      </div>

      <div class="toolbar-title" id="book-title">未打开书籍</div>

      <div class="toolbar-right">
        <button id="btn-page-mode" class="btn" title="单页/双页">单页</button>
        <button id="btn-layout" class="btn" title="版式设置">版式</button>
        <span class="divider"></span>
        <button id="btn-font-dec" class="btn" title="缩小字号">A-</button>
        <button id="btn-font-inc" class="btn" title="放大字号">A+</button>
        <span class="divider"></span>
        <button class="btn theme-btn" data-theme="light" title="日间">日</button>
        <button class="btn theme-btn" data-theme="sepia" title="护眼">护眼</button>
        <button class="btn theme-btn" data-theme="dark" title="夜间">夜</button>
      </div>
    </header>

    <div id="layout-popover" class="layout-popover" hidden>
      <div class="layout-row">
        <label for="layout-margin">屏幕边距</label>
        <input id="layout-margin" type="range" min="12" max="160" step="2" />
        <span id="layout-margin-value"></span>
      </div>
      <div class="layout-row">
        <label for="layout-padding">页内留白</label>
        <input id="layout-padding" type="range" min="16" max="120" step="2" />
        <span id="layout-padding-value"></span>
      </div>
      <div class="layout-row">
        <label for="layout-gutter">中缝</label>
        <input id="layout-gutter" type="range" min="40" max="220" step="2" />
        <span id="layout-gutter-value"></span>
      </div>
      <div class="layout-actions">
        <button id="btn-layout-reset" class="btn">重置</button>
      </div>
    </div>

    <!-- 主体：侧边目录 + 阅读区 -->
    <div class="main">
      <aside class="sidebar" id="sidebar" hidden>
        <div class="sidebar-header">目录</div>
        <nav class="toc" id="toc"></nav>
      </aside>

      <aside class="sidebar" id="ann-sidebar" hidden>
        <div class="sidebar-header">
          标注
          <span class="ann-export-actions">
            <button id="btn-export" class="btn btn-export" title="导出 Markdown（Obsidian）">MD</button>
            <button id="btn-export-json" class="btn btn-export" title="导出 JSON（完整数据）">JSON</button>
          </span>
        </div>
        <div id="ann-list"></div>
      </aside>

      <section class="viewer-wrap">
        <div class="ambient-scene" aria-hidden="true">
          <img class="ambient-landscape" src="/illustrations/book-town-evening.png" alt="" />
          <div class="ambient-light"></div>
          <div class="ambient-particles">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- epub 渲染到这里 -->
        <div id="viewer" class="viewer"></div>

        <!-- 初始空状态提示 -->
        <div id="empty-state" class="empty-state">
          <div class="empty-panel">
            <div class="empty-art-frame" aria-hidden="true">
              <img src="/illustrations/window-reader-mascot.png" alt="" />
            </div>
            <div class="empty-copy">
              <strong>Light Novel Reader</strong>
              <p>书页尚未展开</p>
            </div>
            <div class="empty-actions">
              <button id="btn-empty-open" class="btn btn-primary" type="button">打开 EPUB</button>
              <button id="btn-empty-library" class="btn" type="button">进入书库</button>
            </div>
          </div>
        </div>

        <!-- 左右翻页热区 -->
        <button id="prev-zone" class="page-zone page-zone-left" title="上一页" hidden></button>
        <button id="next-zone" class="page-zone page-zone-right" title="下一页" hidden></button>

        <!-- 本地书库书架（覆盖在阅读区上） -->
        <div id="library-view" class="library-view" hidden>
          <div class="library-header">
            <div class="library-title">
              <div class="library-kicker">Local Light Novel Shelf</div>
              <span>本地轻小说书库</span>
              <small>离线优先的轻小说收藏</small>
            </div>
            <div class="library-header-right">
              <div class="library-badge">v0.3 Library</div>
              <button id="btn-library-close" class="btn">关闭</button>
            </div>
          </div>
          <div class="library-actions">
            <button id="btn-library-import-epub" class="btn btn-primary">导入 EPUB</button>
            <button id="btn-library-import-folder" class="btn">导入文件夹</button>
            <button id="btn-library-refresh" class="btn">刷新书架</button>
            <input id="library-import-input" type="file" accept=".epub" multiple hidden />
            <input id="library-folder-input" type="file" accept=".epub" webkitdirectory multiple hidden />
          </div>
          <details id="library-source-panel" class="library-source-panel">
            <summary>更多导入来源</summary>
            <div class="library-path">
              <input id="library-path-input" type="text" spellcheck="false" placeholder="Calibre 书库路径" />
              <button id="btn-library-import-calibre" class="btn">从 Calibre 迁移</button>
            </div>
          </details>
          <div class="library-search">
            <input id="library-search-input" type="search" placeholder="搜索书名、作者或系列" spellcheck="false" />
            <select id="library-remote-source" title="在线来源">
              <option value="anilist">AniList（轻小说元数据）</option>
              <option value="narou">小説家になろう（Web小说元数据）</option>
              <option value="aozora">青空文库（公共版权经典）</option>
            </select>
            <button id="btn-library-search-remote" class="btn" title="按所选来源在线搜索；青空文库是公共版权经典库，不是轻小说主来源">🌐 在线找书</button>
          </div>
          <div id="library-grid" class="library-grid"></div>
        </div>
      </section>
    </div>

    <!-- 底部进度条 -->
    <footer class="statusbar" hidden id="statusbar">
      <button id="btn-prev" class="btn">← 上一页</button>
      <div class="progress">
        <input id="progress-range" type="range" min="0" max="100" value="0" step="0.1" />
        <span id="progress-label">0%</span>
      </div>
      <button id="btn-next" class="btn">下一页 →</button>
    </footer>
  </body>
</html>
