[package]
name = "reader"
version = "0.1.0"
description = "轻小说阅读器（Tauri 桌面壳）"
authors = ["you"]
edition = "2021"

# 本 crate 只做 Tauri 胶水：command 注册、窗口、URI 协议。
# 业务逻辑（EPUB 解析/HTML 清洗/标注存储）一律在 crates/reading-core。

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reading-core = { path = "../crates/reading-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# 元数据连接器的 HTTP 传输（仅壳层用；core 保持无网络）。rustls 避免系统 TLS 差异；
# system-proxy 让 Windows 用户代理设置可用于在线来源。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
zip = "2"
