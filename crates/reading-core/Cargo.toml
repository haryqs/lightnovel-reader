[package]
name = "reading-core"
version = "0.1.0"
edition = "2021"
description = "阅读器跨端核心：EPUB 解析、HTML 清洗、标注存储。不依赖任何 UI/平台框架。"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
quick-xml = "0.36"
encoding_rs = "0.8"
# 标注持久化；bundled 自带 SQLite + FTS5（v2 全文搜索预留），无需系统库
rusqlite = { version = "0.32", features = ["bundled"] }
# bookId = SHA-256(epub 字节) 前 32 hex，须与前端 computeBookId 一致
sha2 = "0.10"
