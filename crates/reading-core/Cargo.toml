[package]
name = "reading-core"
version = "0.1.0"
edition = "2021"
description = "阅读器跨端核心：EPUB 解析、HTML 清洗、标注存储。不依赖任何 UI/平台框架。"

[features]
default = ["native"]
# 桌面/移动用，全量：书库/标注存储 + 插件宿主 + 连接器
native = ["rusqlite", "image", "csv", "base64", "ring"]
# 网页用，纯计算（EPUB 解析、HTML 清洗、分页），不带任何 I/O
wasm = ["wasm-bindgen"]
# QuickJS 引擎（桌面/移动端插件运行时）
quickjs = ["rquickjs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# EPUB 本质是 zip；只用 deflate 压缩（纯 Rust，避免 bzip2/lzma/zstd 的 C 依赖）
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
encoding_rs = "0.8"
# 标注持久化；bundled 自带 SQLite + FTS5（v2 全文搜索预留），无需系统库
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# bookId = SHA-256(epub 字节) 前 32 hex，须与前端 computeBookId 一致
sha2 = "0.10"
# 封面缩略图（导入时生成小图，书架懒加载）。仅启用 png/jpeg 解码以控体积；
# 其它格式解码失败时缩略图 fail-open 跳过，书架回退用原图。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
# 青空文库连接器：解析官方扩展目录 CSV（带引号字段）。纯解析、按表头名取列。
csv = { version = "1", optional = true }
# 分页 HTML 解析：zero-copy、为速度和小体积设计，wasm 场景友好。
tl = "0.7"
# QuickJS 引擎（桌面端插件 JS 执行）；可选，wasm 下不链接
rquickjs = { version = "0.9", optional = true }
# 官方插件包 Ed25519 验签；仅 native 插件仓库路径启用。
base64 = { version = "0.22", optional = true }
ring = { version = "0.17", optional = true }
