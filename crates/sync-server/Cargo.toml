[package]
name = "sync-server"
version = "0.7.0"
edition = "2021"
description = "自托管同步服务器：WebSocket 实时推送 + REST 增量拉取，用户自己 VPS/NAS 跑"
license = "AGPL-3.0-only"
repository = "https://github.com/haryqs/lightnovel-reader"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
reading-core = { path = "../reading-core", features = ["native"] }
